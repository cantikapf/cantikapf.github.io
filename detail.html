<script src="./assets/js/data.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function (event) {
     const params = new URLSearchParams(window.location.search);
     const type = params.get('type');
     const id = params.get('id');
     
     const contentDiv = document.getElementById('dynamic-content');
     
     if (type && id && portfolioData && portfolioData[type] && portfolioData[type][id]) {
         const item = portfolioData[type][id];
         contentDiv.innerHTML = item.content;
         if (item.title) {
             document.title = item.title;
         }
     } else {
         contentDiv.innerHTML = '<div class="text-center" style="margin-top: 100px;"><h2>Data not found.</h2><a href="./index.html" class="btn btn-default">Return to Home</a></div>';
     }
  });
</script>
